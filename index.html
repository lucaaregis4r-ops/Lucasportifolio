<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Portfólio pessoal de Lucas Regis com projetos em dados, tecnologia, automações, dashboards, jogos e soluções digitais."
  >
  <title>Lucas Regis | Portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-shell">
    <main class="portfolio-layout" aria-label="Portfólio de projetos">
      <section class="projects-column" aria-labelledby="projects-title">
        <div class="section-heading">
          <p class="section-heading__kicker">Seleção inicial</p>
          <h2 id="projects-title">Projetos</h2>
        </div>

        <div
          id="projects-list"
          class="projects-grid"
          role="list"
          aria-live="polite"
          aria-busy="true"
        >
          <article class="project-card project-card--loading" role="listitem">
            <span class="project-card__status">Carregando</span>
            <h3>Buscando projetos...</h3>
            <p>Os cards serão montados automaticamente a partir de <code>data/projetos.json</code>.</p>
          </article>
        </div>
      </section>

      <div class="timeline-divider" aria-hidden="true"></div>

      <aside class="details-column" aria-labelledby="details-title">
        <section id="project-details" class="project-details" tabindex="-1" aria-live="polite">
          <div class="project-details__content">
            <button
              id="back-button"
              type="button"
              class="back-button"
              aria-label="Voltar para a apresentação inicial"
              hidden
            >
              Voltar
            </button>
            <p class="project-details__kicker">Apresentação</p>
            <h2 id="details-title">Dados, psicologia, esporte e soluções</h2>
            <p>Carregando apresentação...</p>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
