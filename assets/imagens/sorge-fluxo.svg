<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do assistente Sorge</title>
  <desc id="desc">Mensagens do Telegram chegam ao Sorge. Comandos diretos seguem por regras locais; frases abertas podem usar um modelo de linguagem. Eventos passam pelo n8n e Google Calendar ou ficam no SQLite local quando a integração não está disponível.</desc>
  <rect width="1200" height="720" fill="#f2eef0"/>
  <text x="72" y="80" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#4d3048">SORGE / FLUXO DO PROJETO</text>
  <text x="72" y="116" font-family="Arial, sans-serif" font-size="18" fill="#625861">Diagrama baseado na implementação publicada</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="72" y="185" width="250" height="120" rx="10" fill="#4d3048"/>
    <text x="197" y="237" font-size="23" font-weight="700" fill="#fff">Telegram</text>
    <text x="197" y="267" font-size="16" fill="#ece3e9">mensagem recebida</text>
    <path d="M 322 245 H 409" stroke="#4d3048" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="420" y="185" width="330" height="120" rx="10" fill="#fff" stroke="#4d3048" stroke-width="3"/>
    <text x="585" y="237" font-size="23" font-weight="700" fill="#352730">Sorge</text>
    <text x="585" y="267" font-size="16" fill="#625861">roteamento e confirmação</text>
    <path d="M 525 305 V 364 H 365 V 391" stroke="#4d3048" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M 650 305 V 364 H 840 V 391" stroke="#4d3048" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="174" y="404" width="382" height="104" rx="10" fill="#fff" stroke="#aa899d" stroke-width="2"/>
    <text x="365" y="450" font-size="21" font-weight="700" fill="#352730">Comandos diretos</text>
    <text x="365" y="478" font-size="16" fill="#625861">regras locais, sem chamada ao modelo</text>
    <rect x="650" y="404" width="382" height="104" rx="10" fill="#fff" stroke="#aa899d" stroke-width="2"/>
    <text x="841" y="450" font-size="21" font-weight="700" fill="#352730">Frases abertas</text>
    <text x="841" y="478" font-size="16" fill="#625861">interpretação opcional por LLM</text>
    <path d="M 365 508 V 534 H 515" stroke="#4d3048" stroke-width="4" fill="none"/>
    <path d="M 841 508 V 534 H 685" stroke="#4d3048" stroke-width="4" fill="none"/>
    <rect x="515" y="515" width="170" height="48" rx="8" fill="#4d3048"/>
    <text x="600" y="544" font-size="17" font-weight="700" fill="#fff">Agenda / lembretes</text>
    <path d="M 565 563 V 589 H 402 V 603" stroke="#4d3048" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M 635 563 V 589 H 797 V 603" stroke="#4d3048" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <rect x="250" y="610" width="305" height="76" rx="10" fill="#e3d6df"/>
    <text x="402" y="642" font-size="19" font-weight="700" fill="#352730">n8n / Google Calendar</text>
    <text x="402" y="666" font-size="15" fill="#625861">integração quando disponível</text>
    <rect x="645" y="610" width="305" height="76" rx="10" fill="#e3d6df"/>
    <text x="797" y="642" font-size="19" font-weight="700" fill="#352730">SQLite local</text>
    <text x="797" y="666" font-size="15" fill="#625861">registro e fallback</text>
  </g>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0 L 8 4.5 L 0 9 Z" fill="#4d3048"/></marker></defs>
</svg>
